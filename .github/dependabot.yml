# Version updates are scoped to the @googleapis/* graph only (14 per-API
# packages + googleapis-common move together); everything else stays on
# security-alerts-only as before.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # fix(deps) so a merged grouped bump is a Conventional Commit and cuts a
    # patch release; without it the bump only ships with the next fix:/feat:.
    commit-message:
      prefix: "fix(deps)"
    allow:
      - dependency-name: "@googleapis/*"
      - dependency-name: "googleapis-common"
    # The @googleapis/* packages pin googleapis-common@^N. Any MAJOR move of
    # this graph must be one manual, coordinated PR that bumps googleapis-common
    # together with the 14 API packages: Dependabot cannot express that (a
    # grouped majors PR strands the common pin -> two copies -> cross-major auth
    # type mismatch, every tools file fails typecheck), so majors are ignored on
    # BOTH sides here and minors/patches keep flowing grouped.
    ignore:
      - dependency-name: "googleapis-common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@googleapis/*"
        update-types: ["version-update:semver-major"]
    groups:
      googleapis:
        patterns:
          - "@googleapis/*"
          - "googleapis-common"
