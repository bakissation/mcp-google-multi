name: ci

on:
  push:
    branches: [main, staging, dev, feat/6.2]
  pull_request:
    branches: [main, staging, dev, feat/6.2]

# Least privilege: CI only checks out code + runs npm. (CodeQL: actions/missing-workflow-permissions)
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # CURATED_METHOD_TOOLS feeds write-control's escape-hatch name
      # resolution (google_api_call); a curated tool that starts or stops
      # calling a Discovery method would otherwise silently drift the map
      # without anyone noticing. See scripts/extract-curated-method-map.ts.
      - name: Curated method map drift check
        run: npx tsx scripts/extract-curated-method-map.ts --check

      # COVERAGE.md and the skill reference tables are generated from the tool
      # registry; a tool added, removed or reclassified without regenerating
      # them would otherwise drift silently.
      - name: Generated docs drift check
        run: |
          npm run gen:coverage
          npm run gen:skill
          git diff --exit-code -- COVERAGE.md skills

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Lazy mode's promise is a small context footprint; growth past the
      # budget is a regression. Baseline: tests/fixtures/lazy-bytes-baseline.json.
      - name: Lazy tools/list byte budget
        run: node scripts/measure-tools.mjs --check

      # Deterministic, network-free tool-surface contract (see eval/README.md).
      - name: Contract suite (promptfoo)
        env:
          PROMPTFOO_DISABLE_UPDATE: '1'
        run: npm run eval:contract

  # Separate job: branch protection requires the check named "ci" exactly; a
  # matrix would rename it. Only leg exercising the declared Node engines floor.
  ci-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Separate job on purpose: branch protection requires the check literally named
  # "ci" — turning the job above into an OS matrix would rename it to "ci (...)".
  ci-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
