name: backmerge

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  backmerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Open + merge the post-release resync PRs
        env:
          GH_TOKEN: ${{ secrets.BACKMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          SRC: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set +e
          # The release tag sits on the released commit; `gh release view` resolves
          # "latest" and ignores prereleases, so derive it from the SHA instead.
          TAG=$(git tag --points-at "$HEAD_SHA" | head -n 1)
          case "$SRC" in
            main) targets="staging dev" ;;
            *)    targets="dev" ;;
          esac
          for target in $targets; do
            url=$(gh pr create --repo "$REPO" --base "$target" --head "$SRC" \
                  --title "chore: back-merge $SRC into $target (resync after ${TAG:-latest release})" \
                  --body "Automated post-release resync so \`$target\` tracks \`$SRC\` (${TAG:-latest release}). No content change.")
            if [ -z "$url" ]; then
              echo "nothing to back-merge into $target (already in sync or PR exists)"
              continue
            fi
            if gh pr merge "$url" --repo "$REPO" --merge; then
              echo "merged: $url"
            elif gh pr merge "$url" --repo "$REPO" --auto --merge; then
              echo "queued auto-merge: $url"
            else
              echo "could not merge $url (resolve manually)"
            fi
          done
          exit 0
